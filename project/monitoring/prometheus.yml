global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: inference-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
