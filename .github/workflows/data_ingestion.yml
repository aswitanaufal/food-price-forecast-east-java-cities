name: Automatic Ingestion and Preprocessing Data

on:
  schedule:
    # 06:30 UTC = 13:30 WIB (antisipasi data belum siap)
    - cron: "30 6 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingestion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt

      - name: Run data ingestion
        run: |
          python project/src/ingest_data.py

      - name: Run preprocessing
        run: |
          python project/src/preprocess.py
      
      - name: Run Feature Engineering
        run: |
          python project/src/feature_engineering.py
      
      - name: Push to dvc
        env:
          DAGSHUB_USER: aswitanaufal
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          if [ -z "${DAGSHUB_TOKEN:-}" ]; then
            echo "::error::DAGSHUB_TOKEN is empty. Create a repository Actions secret with exactly this name."
            exit 1
          fi
          echo "::add-mask::$DAGSHUB_TOKEN"
          dvc remote modify --local origin auth basic
          dvc remote modify --local origin user "$DAGSHUB_USER"
          dvc remote modify --local origin password "$DAGSHUB_TOKEN"
          dvc push -r origin

      - name: Check generated files
        run: |
          echo "Generated raw files:"
          find project/data/raw -type f

          echo "Generated processed files:"
          find project/data/processed -type f

      - name: Commit and push generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add project/data/raw project/data/processed

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update ingested data"
            echo "Changes committed."
            git push origin HEAD:ingestion-experiment
          fi