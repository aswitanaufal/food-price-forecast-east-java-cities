services:
  mlflow-model:
    image: east-java-food-price-model:dagshub-production
    pull_policy: never
    deploy:
      replicas: 3
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ping')"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ml-network

  api-gateway:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./project/deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      mlflow-model:
        condition: service_healthy
    networks:
      - ml-network

  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v2.22.1
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/mlruns
    ports:
      - "5000:5000"
    volumes:
      - mlflow-db:/mlflow
      - ./mlruns:/mlflow/mlruns
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ml-network

networks:
  ml-network:
    driver: bridge

volumes:
  mlflow-db:
