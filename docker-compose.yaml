services:
  api-service:
    build:
      context: .
      dockerfile: project/deployment/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DAGSHUB_TOKEN: ${DAGSHUB_TOKEN:-}
      DAGSHUB_REPO_OWNER: aswitanaufal
      DAGSHUB_REPO_NAME: food-price-forecast-east-java-cities
      MODEL_URI: models:/EastJavaFoodPriceForecast@champion
    depends_on:
      mlflow-server:
        condition: service_healthy
    networks:
      - ml-network

  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v2.22.1
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/mlruns
    ports:
      - "5000:5000"
    volumes:
      - mlflow-db:/mlflow
      - ./mlruns:/mlflow/mlruns
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ml-network

networks:
  ml-network:
    driver: bridge

volumes:
  mlflow-db:
